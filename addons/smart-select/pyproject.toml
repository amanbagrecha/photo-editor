[project]
name = "photo-editor-smart-select"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
    "mlx-sam; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
    "numpy>=1.26",
    "pillow>=11",
]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.17"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release == '23.0.0'",
]

[tool.uv.sources]
mlx-sam = { path = "../../vendor/mlx_sam-0.3.0-py3-none-any.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'" }

[project]
name = "photo-editor-upscale"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
    "mlx-gen>=0.37; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '23'",
    "numpy>=1.26",
    "pillow>=11",
]

[tool.uv]
package = false
no-build = true
required-version = ">=0.12.17"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release == '23.0.0'",
]
